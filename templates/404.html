{% extends "base.html" %}

{% block title %}Page Not Found (404){% endblock %}

{% block content_auth %}
<div class="auth-container">
    <div class="auth-card text-center py-5">
        <div class="mb-3 text-warning fs-1">
            <i class="bi bi-exclamation-triangle"></i>
        </div>
        <h1 class="display-4 fw-bold">404</h1>
        <h4 class="fw-bold mb-3">Page Not Found</h4>
        <p class="text-muted mb-4">The page or resource you are looking for does not exist or has been moved.</p>
        <a href="{{ url_for('main.dashboard') }}" class="btn btn-primary btn-action">
            <i class="bi bi-house me-2"></i>Return to Dashboard
        </a>
    </div>
</div>
{% endblock %}
