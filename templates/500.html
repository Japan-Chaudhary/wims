{% extends "base.html" %}

{% block title %}Server Error (500){% endblock %}

{% block content_auth %}
<div class="auth-container">
    <div class="auth-card text-center py-5">
        <div class="mb-3 text-danger fs-1">
            <i class="bi bi-x-circle"></i>
        </div>
        <h1 class="display-4 fw-bold text-danger">500</h1>
        <h4 class="fw-bold mb-3">Internal Server Error</h4>
        <p class="text-muted mb-4">Something went wrong on our end. Please try again or return to the main dashboard.</p>
        <a href="{{ url_for('main.dashboard') }}" class="btn btn-primary btn-action">
            <i class="bi bi-house me-2"></i>Return to Dashboard
        </a>
    </div>
</div>
{% endblock %}
